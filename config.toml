# Change the default theme to be use when building the site with Hugo
theme = "hugo-theme-learn"

# GitHub Pages URL for the new repo
baseURL = "https://MinhVuongNhat.github.io/AWS_Workshop_253/"
canonifyURLs = true

# For search functionality
[outputs]
home = [ "HTML", "RSS", "JSON"]

[params]
  # Change default color scheme with a variant one. Can be "red", "blue", "green".
  themeVariant = "workshop"
  # Git hub repo link
  editURL = ""
  description = "AWS Serverless ETL Pipeline & Machine Learning - Stock Price Prediction on NASDAQ"
  author = "MinhVuongNhat"
  showVisitedLinks = true
  disableBreadcrumb = false
  disableNextPrev = false
  math = true

[Languages]
[Languages.en]
title = "AWS ETL Stock Price Prediction"
weight = 1
label = "English"
languageName = "English"

[[Languages.en.menu.shortcuts]]
name = "<i class='fas fa-globe'></i> Live Demo Web"
identifier = "Demo"
url = "http://nasdaq-ai-dashboard-2026-430970051812-ap-southeast-1-an.s3-website-ap-southeast-1.amazonaws.com/"
weight = 5

[[Languages.en.menu.shortcuts]]
name = "<i class='fab fa-github'></i> GitHub Repo"
identifier = "GitHub"
url = "https://github.com/MinhVuongNhat/AWS_ETL_Lambda_Stock_Price_Predict_Classification"
weight = 10

[Languages.vi]
title = "AWS ETL Dự đoán Giá Cổ Phiếu"
weight = 2
label = "Tiếng Việt"
languageName = "Tiếng Việt"

[[Languages.vi.menu.shortcuts]]
name = "<i class='fas fa-globe'></i> Trang Web Demo"
identifier = "Demo"
url = "http://nasdaq-ai-dashboard-2026-430970051812-ap-southeast-1-an.s3-website-ap-southeast-1.amazonaws.com/"
weight = 5

[[Languages.vi.menu.shortcuts]]
name = "<i class='fab fa-github'></i> GitHub Repo"
identifier = "GitHub"
url = "https://github.com/MinhVuongNhat/AWS_ETL_Lambda_Stock_Price_Predict_Classification"
weight = 10

[markup.goldmark.renderer]
  unsafe = true

[markup.goldmark.extensions.passthrough]
  enable = true
  [markup.goldmark.extensions.passthrough.delimiters]
    block = [['\[', '\]'], ['$$', '$$']]
    inline = [['\(', '\)']]          # khuyến nghị dùng \( ... \) thay vì $ ... $

